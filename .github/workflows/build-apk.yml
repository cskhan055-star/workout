name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Ensure Capacitor Config
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            cat << 'EOF' > capacitor.config.json
            {
              "appId": "com.homeworkout.noequipment",
              "appName": "Home Workout",
              "webDir": "dist",
              "server": {
                "androidScheme": "https"
              }
            }
          EOF
          fi

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Setup Platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Sync Capacitor Android
        run: |
          npx cap add android || true
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/compileSdkVersion = 36/compileSdkVersion = 35/g' android/variables.gradle
            sed -i 's/targetSdkVersion = 36/targetSdkVersion = 35/g' android/variables.gradle
          fi
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeWorkout-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
