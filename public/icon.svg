<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16" />
      <stop offset="50%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Center Workout Emblem -->
  <g filter="url(#glow)">
    <!-- Dumbbell Bar -->
    <rect x="180" y="242" width="152" height="28" rx="8" fill="#e5e5e5" />

    <!-- Left Plate Inner -->
    <rect x="148" y="196" width="32" height="120" rx="10" fill="url(#emeraldGrad)" />
    <!-- Left Plate Outer -->
    <rect x="116" y="216" width="26" height="80" rx="8" fill="#10b981" />

    <!-- Right Plate Inner -->
    <rect x="332" y="196" width="32" height="120" rx="10" fill="url(#emeraldGrad)" />
    <!-- Right Plate Outer -->
    <rect x="370" y="216" width="26" height="80" rx="8" fill="#10b981" />

    <!-- Lightning / Dynamic Flame Accent -->
    <path d="M256 120 L276 190 L246 196 L266 260 L226 210 L250 204 Z" fill="url(#flameGrad)" />
  </g>

  <!-- Subtitle Text -->
  <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="4">HOME WORKOUT</text>
  <text x="256" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#34d399" text-anchor="middle" letter-spacing="3">NO EQUIPMENT</text>
</svg>
